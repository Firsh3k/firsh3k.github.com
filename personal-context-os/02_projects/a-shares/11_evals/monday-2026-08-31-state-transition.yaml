  - Monday R/A/D are newly computed and all downstream reports reuse exactly that same object.
  - Friday theme labels are treated as prior state, not as Monday fact.
  - Stock review uses Monday Market State and Monday stock evidence.
  - P0 quantities use actual Monday-confirmed holdings/transactions rather than Friday assumptions if trades occurred.
  - Any Friday pending/data-gap items remain pending until Monday evidence actually resolves them.
  - No production write occurs in V4 TEST mode unless explicitly authorized.

