system:
  name: Personal Context OS
  version: 0.1-DRAFT
  status: DRAFT

routing:
  default_mode: lazy-load
  max_scope: task-relevant-only
  prefer_current_state: true
  inbox_default_authority: non_authoritative
  experience_pool_default_authority: advisory_non_gating
  include_history_when:
    - user asks for comparison or recall
    - current decision depends on prior state
    - regression or audit is requested
  include_inbox_when:
    - user asks to ingest or evaluate external material
    - user asks to promote a candidate insight
    - an eval or research task explicitly depends on an inbox item
  include_experience_pool_when:
    - task-specific router explicitly loads the relevant experience pool
    - user asks for lessons, heuristics, or accumulated practical experience
    - an eval or retrospective is testing experience-pool items

intake:
  trigger_phrases:
    - 喂给 PCOS
    - add to PCOS Context Inbox
    - evaluate for PCOS
  default_flow:
    - source_capture
    - insight_extraction
    - classification
    - routing
    - deduplication
    - conflict_check
    - evidence_assessment
    - impact_assessment
    - intake_card
    - promotion_recommendation
  routing_targets:
    - GLOBAL_CONTEXT
    - PROJECT_CONTEXT
    - SHARED_KNOWLEDGE
    - EXPERIENCE_POOL
    - LESSONS
    - RESEARCH_EVALS
    - ARCHIVE
  insight_types:
    - FACT
    - KNOWLEDGE
    - FRAMEWORK
    - LESSON
    - HYPOTHESIS
    - PRINCIPLE_CANDIDATE
    - STRATEGY_CANDIDATE
  statuses:
    - REFERENCE
    - OBSERVE
    - ACTIVE_CANDIDATE
    - ACTIVE
    - REJECTED
    - ARCHIVED
  high_impact_direct_activation: forbidden

experience_pool:
  purpose: useful_durable_heuristics_not_yet_formal_rules
  authority: advisory_non_gating
  allowed_effects:
    - raise_attention
    - generate_scenarios
    - request_additional_evidence
    - create_prospective_validation_case
  forbidden_independent_effects:
    - high_impact_gate_change
    - irreversible_action_authorization
    - strategy_activation
  preferred_validation:
    - prospective_case_logging
    - include_false_positives
    - later_incremental_value_review

project_contract:
  required:
    - project-manifest.yaml
    - context/current.md
    - decisions/CHANGELOG.md
    - skills/
  recommended:
    - state/
    - corpus/
    - catalog/
    - experience_pool/
    - lessons/
    - evals/
    - reports/

evidence_levels:
  E1: raw_or_structured_fact
  E2: primary_source
  E3: verified_secondary_source
  E4: framework_or_strategy_inference
  E5: model_judgment

version_lifecycle:
  - DRAFT
  - TEST
  - RC
  - ACTIVE
  - DEPRECATED
  - ARCHIVED

persistence:
  default: no_write_without_policy
  inbox_staging_allowed: true
  inbox_write_does_not_imply_promotion: true
  experience_pool_write_does_not_imply_strategy_activation: true
  log_state_delta: true
  preserve_history: true

promotion:
  default: analysis_first_promotion_second
  material_active_changes_require_explicit_promotion: true
  deduplicate_before_add: true
  conflict_check_before_promote: true
  eval_when_behavior_changes: true
  preserve_provenance: true

evolution_tracking:
  architecture_system_of_record: github
  chat_role: proposal_and_collaboration_surface
  changelog_path: CHANGELOG.md
  evolution_log_path: 00_system/evolution/EVOLUTION-LOG.md
  adr_directory: 00_system/evolution/
  material_change_recording_required: true
  material_change_trace:
    - need_or_problem
    - proposal
    - architecture_decision
    - implementation
    - changelog
    - evolution_log
    - validation_or_eval
    - current_state_and_next_gate
  adr_required_when:
    - context_architecture_changes
    - routing_or_loading_semantics_change
    - persistence_or_authority_semantics_change
    - skill_context_boundary_changes
    - source_of_record_strategy_changes
    - lifecycle_or_versioning_changes
    - high_impact_governance_changes
    - migration_architecture_changes
  preserve_superseded_decisions: true
